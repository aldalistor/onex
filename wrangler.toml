name = "onex-complete-webapp"
main = "src/index.ts"
compatibility_date = "2024-09-15"
compatibility_flags = ["nodejs_compat"]

# Account Configuration
account_id = ""  # Will be set via CLOUDFLARE_ACCOUNT_ID env var
workers_dev = true

# Environment-specific configuration
[env.development]
vars = { ENVIRONMENT = "development" }

[env.production]
vars = { ENVIRONMENT = "production" }
routes = [
  { pattern = "onex.example.com/*", zone_name = "example.com" }
]

# D1 Database Configuration
[[d1_databases]]
binding = "DB"
database_name = "onex-erp"
database_id = ""  # Will be set via D1_DATABASE_ID env var
migrations_dir = "migrations"

# R2 Storage Configuration (S3-compatible)
[[r2_buckets]]
binding = "R2_STORAGE"
bucket_name = "onex-uploads"
jurisdiction = "eu"

# KV Namespace Configuration (for caching)
[[kv_namespaces]]
binding = "KV_STORE"
id = ""
preview_id = ""

[[kv_namespaces]]
binding = "KV_SESSIONS"
id = ""
preview_id = ""

# Analytics Engine
[[analytics_engine_datasets]]
binding = "ANALYTICS"

# Triggers for scheduled tasks
[triggers]
crons = [
  "0 */6 * * *"  # Run every 6 hours
]

# Build configuration
[build]
command = "npm run build"
cwd = "./"
watch_paths = ["src/**/*.ts"]

[build.upload]
format = "service-worker"

# Observability
[observability]
enabled = true

# Limits
[limits]
cpu_percentage = 50
